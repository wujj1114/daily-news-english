[project]
name = "news-in-10"
version = "0.1.0"
description = "NEWS IN 10 — 每日英語新聞教學節目自動化產製管線"
readme = "SPEC.md"
requires-python = ">=3.12"
dependencies = [
    "cmudict>=1.0.32",
    "google-genai>=1.0.0",
    "jsonschema>=4.23.0",
    "mutagen>=1.47.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
