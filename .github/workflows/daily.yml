name: Daily News English Pipeline

on:
  schedule:
    # 臺北時間每日 03:17 (UTC 19:17)
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "節目日期（today 或 YYYY-MM-DD）"
        required: false
        default: "today"
      from_stage:
        description: "起始階段（script / tts / publish）"
        required: false
        default: "script"
  push:
    paths:
      - "episodes/*/episode.json"

permissions:
  contents: write

jobs:
  produce-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12 and dependencies
        run: |
          uv python install 3.12
          uv sync

      - name: Cache TTS audio segments
        uses: actions/cache@v4
        with:
          path: .tts_cache
          key: tts-cache-${{ github.run_id }}
          restore-keys: |
            tts-cache-

      - name: Determine target date and start stage
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            CHANGED=$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}" | grep -E '^episodes/[0-9]{4}-[0-9]{2}-[0-9]{2}/episode\.json$' | head -n 1 || true)
            if [[ -n "$CHANGED" ]]; then
              DATE_VAL=$(echo "$CHANGED" | cut -d'/' -f2)
              echo "date=$DATE_VAL" >> "$GITHUB_OUTPUT"
              echo "from_stage=tts" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "date=${{ inputs.date || 'today' }}" >> "$GITHUB_OUTPUT"
          echo "from_stage=${{ inputs.from_stage || 'script' }}" >> "$GITHUB_OUTPUT"

      - name: Run script and TTS stages
        if: steps.target.outputs.from_stage != 'publish'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_SCRIPT_MODEL: ${{ vars.GEMINI_SCRIPT_MODEL || 'gemini-2.5-flash' }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL || 'gemini-2.5-flash-preview-tts' }}
        run: |
          uv run python -m pipeline.run --date "${{ steps.target.outputs.date }}" --from-stage "${{ steps.target.outputs.from_stage }}" --until tts

      - name: Publish Podcast (GitHub Release + RSS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          uv run python -m pipeline.run --date "${{ steps.target.outputs.date }}" --from-stage publish --until publish

      - name: Commit updated RSS feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml docs/index.html episodes/
          if [ -d docs/audio ]; then git add docs/audio/; fi
          if [ -f docs/cover.jpg ]; then git add docs/cover.jpg; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish episode ${{ steps.target.outputs.date }}"
            git push
          fi

      - name: Report failure summary
        if: failure()
        run: |
          {
            echo "## 每日英語新聞教學節目管線執行失敗"
            echo "- 日期：${{ steps.target.outputs.date }}"
            echo "- 起始階段：${{ steps.target.outputs.from_stage }}"
            echo "- 紀錄連結：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
